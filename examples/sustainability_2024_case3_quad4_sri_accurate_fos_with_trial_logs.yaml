metadata:
  id: sustainability_2024_case3_quad4_sri_accurate_fos_with_trial_logs
  name: Sustainability 2024 homogeneous slope Case 3 QUAD4 SRI accurate FOS with SRM trial logs
  purpose: Accurate FOS-oriented Case 3 reproduction with complete SRM trial diagnostics based on sustainability-16-00702.
  units: m-kN
  source: sustainability-16-00702.pdf, Section 3.1, Figure 3, Table 1 Case 3
  notes:
    - Geometry follows Figure 3: 20 m base, 10 m left height, 4 m right bench height, 10 m crest, 45 degree slope.
    - Case 3 material follows Table 1: c=20 kPa, phi=5 degrees; E=14 MPa, nu=0.3, gamma=20 kN/m3, dilation=0 degrees.
    - Mesh is a QUAD4 SRI starter mesh; element size is refined from about 2.0 m to about 0.5 m.
    - Published FOS reference values are about 1.06 to 1.20; eSPFEM in the paper reports 1.18.
    - Accurate FOS tuning uses factor_tol=0.005, failure_plastic_ratio=1.0, and larger Newton/cutback allowance.
    - SRM trial diagnostics are written to analysis_log.json/csv/html, run.log, and report SRM trial tables.
    - Trial diagnostics include plastic_ratio_delta, equivalent plastic strain statistics, yielded element count, connected plastic cluster size, boundary span, increment/cutback, Newton, residual, displacement, detJ, and work-ratio metrics.
