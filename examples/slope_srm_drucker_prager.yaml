metadata:
  id: slope_srm_drucker_prager
  name: Slope SRM Drucker-Prager realistic starter
  purpose: Plane-strain slope stability template for strength reduction analysis using
    a Drucker-Prager material.
  units: m-kN
  notes:
  - Homogeneous weathered colluvium slope, 30 m crest height and 10 m toe bench.
  - Use as a realistic starter model; confirm site-specific geometry, groundwater,
    and material parameters before design use.
  - The SRM stage is configured to return a FOS for this dry slope case without the
    tensile cutoff that made the trial tangent singular.
  - SRM factors include both the below-1.0 branch and the above-1.0 branch so an already-unstable
    case can report FOS < 1 when the failure bracket occurs below the current-strength
    state.
  - Two-branch SRM starts from factor 1.0; each trial is solved independently from
    the stage-start state, not continued from the previous FOS trial.
  - 'Template mesh density is doubled from the original starter mesh: nx=32, ny=12,
    target_size=2.5 m.'
template_variants:
  integrations:
  - FULL
  - B-bar
  - SRI
  default_integration: B-bar
analysis:
  dimension: 2D
  type: static_plane_strain
  unit_system: m-kN
  fields:
  - u
  description: Slope SRM with self weight and Drucker-Prager strength reduction.
