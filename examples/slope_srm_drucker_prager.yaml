materials:
  colluvium_dp:
    model: drucker_prager
    E: 30000.0
    nu: 0.33
    gamma: 18.5
    cohesion: 20.0
    friction_angle: 31.0
    dilation_angle: 3.0
    hardening: 0.0
    k0: 0.48
    tension_cutoff: false
boundary_conditions:
- name: base_fixed
  set: bottom
  ux: 0.0
  uy: 0.0
- name: left_roller
  set: left
  ux: 0.0
- name: right_roller
  set: right
  ux: 0.0
loads:
- name: self_weight
  type: gravity
  all: true
  gx: 0.0
  gy: -1.0
  scale: 1.0
solver:
  tangent: analytic
  newton:
    max_iter: 50
    tol_rel: 1.0e-07
    tol_abs: 1.0e-09
    line_search: true
    max_line_search: 8
  increments:
    enabled: true
    steps: 6
    max_cutbacks: 5
    cutback_factor: 0.5
    min_step: 0.0001
stages:
- name: srm_strength_reduction
  type: srm
  description: Reduce cohesion and friction strength under self weight and report
    the searched factor of safety for the dry slope.
  srm:
    search_mode: adaptive_bracket
    anchor_factor: 1.0
    bracket_stride: 3
    factor_tol: 0.01
    max_bisection: 6
    lower_branch:
      factor_min: 0.5
      factor_step: 0.1
    upper_branch:
      factor_max: 1.6
      factor_step: 0.1
    factor_start: 0.5
    factor_max: 1.6
    factor_step: 0.1
    failure_plastic_ratio: 1.0
  solver:
    newton:
      max_iter: 60
      tol_rel: 1.0e-07
      tol_abs: 1.0e-09
      line_search: true
      max_line_search: 8
    increments:
      enabled: true
      steps: 8
      max_cutbacks: 6
      cutback_factor: 0.5
      min_step: 0.0001
post:
  srm:
    slope_direction: left-to-right
    min_candidate_length: 12.0
    max_circle_radius: 70.0
    require_boundary_exit: true
  result_fields:
  - displacement
  - plastic
  - yield_value
  - FL
  - srm_slip_candidates
output:
  directory: runs/slope_srm_drucker_prager
